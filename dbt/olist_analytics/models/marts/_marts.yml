version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_product
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: category
        tests: [not_null]

  - name: dim_seller
    columns:
      - name: seller_key
        tests: [unique, not_null]

  - name: dim_geography
    description: "One centroid per zip prefix, filtered to Brazil's bounding box. City selected by mode."
    columns:
      - name: geography_key
        tests: [unique, not_null]
      - name: zip_code
        tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: full_date
        tests: [unique, not_null]

  - name: fct_orders
    columns:
      - name: order_key
        tests: [unique, not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: purchase_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fct_order_items
    columns:
      - name: order_item_key
        tests: [unique, not_null]
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: seller_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_key
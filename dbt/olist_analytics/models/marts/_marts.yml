version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: customer_id
        tests: [unique, not_null]

  - name: dim_product
    columns:
      - name: product_key
        tests: [unique, not_null]
      - name: category
        tests: [not_null]

  - name: dim_seller
    columns:
      - name: seller_key
        tests: [unique, not_null]

  - name: dim_geography
    description: "One centroid per zip prefix, filtered to Brazil's bounding box. City selected by mode."
    columns:
      - name: geography_key
        tests: [unique, not_null]
      - name: zip_code
        tests: [unique, not_null]

  - name: dim_date
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: full_date
        tests: [unique, not_null]

  - name: fct_orders
    columns:
      - name: order_key
        tests: [unique, not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: purchase_date_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: delivery_bucket
        tests:
          - accepted_values:
              arguments:
                values:
                  - 'Not delivered'
                  - '10+ days early'
                  - '5-9 days early'
                  - '1-4 days early'
                  - 'On time'
                  - '1-4 days late'
                  - '5-9 days late'
                  - '10+ days late'

  - name: fct_order_items
    columns:
      - name: order_item_key
        tests: [unique, not_null]
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: seller_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_key

  - name: mart_delivery_performance
    description: "Delivery variance bands with review and value metrics. Bands are defined once in the delivery_bucket macro and carried on fct_orders; delivery_bucket_sort gives display order and drives score_delta_vs_earliest."

  - name: mart_sales_performance
    description: "One row per category per month, delivered orders only. Revenue is item price excluding freight; adds running total, month-over-month growth, and within-month category rank and share."